[project]
name = "haxkday"
version = "0.1.0"
description = "haxkday"
requires-python = ">=3.9"
dependencies = [
    "daytona>=0.200.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "braintrust>=0.30",
    "elevenlabs>=2.60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
