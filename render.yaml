services:
  - type: web
    name: morgan-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FIREWORKS_MODEL
        value: accounts/fireworks/models/llama-v3p1-70b-instruct
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: BRAINTRUST_API_KEY
        sync: false
      - key: BRAINTRUST_PROJECT
        value: morgan-ai
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: morgan_ai
      - key: VOYAGE_API_KEY
        sync: false
      - key: SEC_EDGAR_USER_AGENT
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
